<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 248" width="748" height="248" role="img" aria-label="Gantt chart for round robin scheduling with time quantum 2">
  <style>
    .gl { stroke: #e4e4ea; stroke-width: 1; stroke-dasharray: 3 3; }
    .ax { stroke: #9a9aa6; stroke-width: 1.25; }
    .tk { fill: #5c5c6a; font: 500 11px Inter, system-ui, sans-serif; }
    .pl { fill: #3a3a48; font: 600 12px Inter, system-ui, sans-serif; }
    .bl { font: 600 11.5px Inter, system-ui, sans-serif; text-anchor: middle; }
    .cap { fill: #6b6b7a; font: 500 11px Inter, system-ui, sans-serif; }
  </style>

  <rect x="0" y="0" width="748" height="248" fill="#ffffff" rx="8" />

  <g>
    <line class="gl" x1="70"  y1="24" x2="70"  y2="196" />
    <line class="gl" x1="110" y1="24" x2="110" y2="196" />
    <line class="gl" x1="150" y1="24" x2="150" y2="196" />
    <line class="gl" x1="190" y1="24" x2="190" y2="196" />
    <line class="gl" x1="230" y1="24" x2="230" y2="196" />
    <line class="gl" x1="270" y1="24" x2="270" y2="196" />
    <line class="gl" x1="310" y1="24" x2="310" y2="196" />
    <line class="gl" x1="350" y1="24" x2="350" y2="196" />
    <line class="gl" x1="390" y1="24" x2="390" y2="196" />
    <line class="gl" x1="430" y1="24" x2="430" y2="196" />
    <line class="gl" x1="470" y1="24" x2="470" y2="196" />
    <line class="gl" x1="510" y1="24" x2="510" y2="196" />
    <line class="gl" x1="550" y1="24" x2="550" y2="196" />
    <line class="gl" x1="590" y1="24" x2="590" y2="196" />
    <line class="gl" x1="630" y1="24" x2="630" y2="196" />
    <line class="gl" x1="670" y1="24" x2="670" y2="196" />
    <line class="gl" x1="710" y1="24" x2="710" y2="196" />
  </g>

  <g>
    <text class="pl" x="60" y="49"  text-anchor="end">P1</text>
    <text class="pl" x="60" y="89"  text-anchor="end">P2</text>
    <text class="pl" x="60" y="129" text-anchor="end">P3</text>
    <text class="pl" x="60" y="169" text-anchor="end">P4</text>
  </g>

  <g>
    <rect x="70"  y="32" width="80"  height="26" rx="4" fill="#ede9fe" stroke="#7c6cf0" />
    <text class="bl" x="110" y="49" fill="#4b3fb5">P1</text>
    <rect x="390" y="32" width="80"  height="26" rx="4" fill="#ede9fe" stroke="#7c6cf0" />
    <text class="bl" x="430" y="49" fill="#4b3fb5">P1</text>
  </g>

  <g>
    <rect x="150" y="72" width="80" height="26" rx="4" fill="#dff3f9" stroke="#31a1bf" />
    <text class="bl" x="190" y="89" fill="#0d5f73">P2</text>
    <rect x="470" y="72" width="40" height="26" rx="4" fill="#dff3f9" stroke="#31a1bf" />
  </g>

  <g>
    <rect x="230" y="112" width="80"  height="26" rx="4" fill="#e3f6e8" stroke="#46b866" />
    <text class="bl" x="270" y="129" fill="#1a6b33">P3</text>
    <rect x="510" y="112" width="120" height="26" rx="4" fill="#e3f6e8" stroke="#46b866" />
    <text class="bl" x="570" y="129" fill="#1a6b33">P3</text>
  </g>

  <g>
    <rect x="310" y="152" width="80" height="26" rx="4" fill="#fdecf3" stroke="#dd5f96" />
    <text class="bl" x="350" y="169" fill="#a01546">P4</text>
  </g>

  <line class="ax" x1="70" y1="196" x2="726" y2="196" />
  <g class="tk" text-anchor="middle">
    <text x="70"  y="212">0</text>
    <text x="110" y="212">2</text>
    <text x="150" y="212">4</text>
    <text x="190" y="212">6</text>
    <text x="230" y="212">8</text>
    <text x="270" y="212">10</text>
    <text x="310" y="212">12</text>
    <text x="350" y="212">14</text>
    <text x="390" y="212">16</text>
  </g>

  <text class="cap" x="70" y="238">Bursts: P1 = 4, P2 = 3, P3 = 5, P4 = 2. All arrive at t = 0. Quantum = 2.</text>
</svg>
