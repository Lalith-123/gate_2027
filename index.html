<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Practice GATE previous-year questions with a filterable question bank, revision tracking and detailed solutions. Built for GATE 2027 preparation."
    />
    <title>GATE Practice — Previous Year Questions for GATE 2027</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('gate.settings.v1');
          var settings = stored ? JSON.parse(stored) || {} : {};
          var mode = settings.theme || 'system';
          var dark =
            mode === 'dark' ||
            ((mode === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? 'dark' : 'light';
          root.style.colorScheme = dark ? 'dark' : 'light';
          if (settings.reduceMotion) root.classList.add('reduce-motion');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
